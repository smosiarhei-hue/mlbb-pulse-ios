name: MLBBPulse
options:
  bundleIdPrefix: app.mlbbpulse
  deploymentTarget:
    iOS: "17.0"
targets:
  MLBBPulse:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mlbbpulse.ios
        PRODUCT_NAME: MLBBPulse
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_MODULE_NAME: MLBBPulse
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MLBB Pulse"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: MLBBPulse.entitlements
  MLBBPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MLBBPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mlbbpulse.ios.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MLBBPulse:
    build:
      targets:
        MLBBPulse: all
        MLBBPulseTests: [test]
    test:
      targets:
        - MLBBPulseTests
