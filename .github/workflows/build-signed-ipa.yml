name: Signed IPA and Telegram
on:
  workflow_dispatch:
  push:
    branches: [feature/modern-mlbb-pulse-home]
permissions:
  contents: read
concurrency:
  group: signed-mlbb-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-ipa:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run release script tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate required settings
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          MLBB_BUNDLE_ID: ${{ vars.MLBB_BUNDLE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for pair in P12_BASE64:APPLE_CERT_P12_BASE64 P12_PASSWORD:P12_PASSWORD PROFILE_BASE64:PROVISION_PROFILE_BASE64 MLBB_BUNDLE_ID:MLBB_BUNDLE_ID; do
            key="${pair%%:*}"; name="${pair#*:}"
            if [ -z "${!key}" ]; then echo "Missing required setting: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/mlbb.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/mlbb.mobileprovision" > "$RUNNER_TEMP/mlbb-profile.plist"
          python3 scripts/signing_profile.py "$RUNNER_TEMP/mlbb-profile.plist"
      - name: Install certificate and profile
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mlbb-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mlbb.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$RUNNER_TEMP/mlbb.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>/dev/null; then
            trap 'rm -f "$RUNNER_TEMP/mlbb-cert.pem" "$RUNNER_TEMP/mlbb-legacy.p12"' EXIT
            OPENSSL_BIN="$(command -v openssl)"
            for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl; do
              if [ -x "$candidate" ]; then OPENSSL_BIN="$candidate"; break; fi
            done
            "$OPENSSL_BIN" pkcs12 -in "$RUNNER_TEMP/mlbb.p12" -passin env:P12_PASSWORD -nodes -out "$RUNNER_TEMP/mlbb-cert.pem"
            "$OPENSSL_BIN" pkcs12 -export -legacy -in "$RUNNER_TEMP/mlbb-cert.pem" -out "$RUNNER_TEMP/mlbb-legacy.p12" -passout env:P12_PASSWORD
            security import "$RUNNER_TEMP/mlbb-legacy.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" > "$RUNNER_TEMP/mlbb-identities.txt"
          python3 - <<'PYCODE'
          import hashlib, os, plistlib, re, sys
          root = os.environ['RUNNER_TEMP']
          with open(root+'/mlbb-profile.plist','rb') as f: profile=plistlib.load(f)
          with open(root+'/mlbb-identities.txt') as f: identities=f.read()
          valid=set(re.findall(r'\b[0-9A-F]{40}\b', identities))
          allowed={hashlib.sha1(cert).hexdigest().upper() for cert in profile.get('DeveloperCertificates', [])}
          matches=valid & allowed
          if len(matches)!=1:
              print('Expected exactly one signing identity matching the profile.',file=sys.stderr); sys.exit(1)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIGNING_IDENTITY='+matches.pop()+'\n')
          PYCODE
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/mlbb.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/mlbb.p12"
      - name: Install XcodeGen and generate project
        run: brew install xcodegen && python3 scripts/materialize_icon.py && xcodegen generate
      - name: Archive signed app
        run: |
          set -euo pipefail
          xcodebuild -project MLBBPulse.xcodeproj -scheme MLBBPulse -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MLBBPulse.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$MLBB_BUNDLE_ID" CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
      - name: Export IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          data={'method':os.environ['EXPORT_METHOD'], 'signingStyle':'manual', 'teamID':os.environ['TEAM_ID'], 'provisioningProfiles':{os.environ['MLBB_BUNDLE_ID']:os.environ['PROFILE_UUID']}}
          with open(os.environ['RUNNER_TEMP']+'/mlbb-export.plist','wb') as f: plistlib.dump(data,f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MLBBPulse.xcarchive" -exportPath release -exportOptionsPlist "$RUNNER_TEMP/mlbb-export.plist"
          test -s release/MLBBPulse.ipa
      - name: Verify compiled app icon
        run: |
          python3 - <<'PYCODE'
          import plistlib, zipfile, sys
          with zipfile.ZipFile('release/MLBBPulse.ipa') as z:
              names = z.namelist()
              infos = [n for n in names if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/') == 2]
              if len(infos) != 1: raise SystemExit('Missing main app Info.plist')
              info = plistlib.loads(z.read(infos[0])); prefix = infos[0].rsplit('/', 1)[0] + '/'
              if prefix+'Assets.car' not in names: raise SystemExit('Compiled asset catalog is missing')
              if not (info.get('CFBundleIconName') or info.get('CFBundleIcons')): raise SystemExit('App icon is not declared in Info.plist')
              print('Compiled asset catalog and icon declaration found in IPA.')
          PYCODE
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBBPulse-signed-ipa
          path: release/MLBBPulse.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Clean up signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mlbb-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/mlbb.p12" "$RUNNER_TEMP/mlbb.mobileprovision" "$RUNNER_TEMP/mlbb-profile.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
  deploy-ota:
    needs: signed-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MLBBPulse-signed-ipa
          path: release
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare installation page and manifest
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          MLBB_BUNDLE_ID: ${{ vars.MLBB_BUNDLE_ID }}
        run: python3 scripts/create_ota.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish OTA site
        id: deployment
        uses: actions/deploy-pages@v4
  telegram:
    needs: [signed-ipa, deploy-ota]
    if: always() && needs.signed-ipa.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MLBBPulse-signed-ipa
          path: release
      - name: Send IPA and confirmed installation link
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8559869613' }}
          OTA_PUBLISHED: ${{ needs.deploy-ota.result == 'success' }}
          OTA_URL: ${{ needs.deploy-ota.outputs.page_url }}
        run: python3 scripts/send_telegram.py
