name: iOS CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feature/modern-mlbb-pulse-home]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild -project MLBBPulse.xcodeproj -scheme MLBBPulse -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        run: xcodebuild -project MLBBPulse.xcodeproj -scheme MLBBPulse -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO test
